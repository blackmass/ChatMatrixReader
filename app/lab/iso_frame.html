<!doctype html><meta charset="utf-8"><script src="probe.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const r = [];
  try { r.push(...await probe(window)); } catch (e) { r.push('probe failed: ' + e); }
  for (const [name, fn] of [['parent.__TAURI__', () => typeof parent.__TAURI__], ['parent.document', () => typeof parent.document.body], ['top.__TAURI_INTERNALS__', () => typeof top.__TAURI_INTERNALS__]]) {
    try { r.push(`${name} -> ${fn()}`); } catch (e) { r.push(`${name} -> blocked (${e && e.name})`); }
  }
  parent.postMessage(r, '*');
})();
</script>
