<!doctype html>
<!-- LAB (a test, to be removed): a "control center" of the test in src-tauri/src/lab.rs: a transparent window over all the screens with fake panes (windows) in it.
     ?mode=0|1|2: 0 an ordinary window, 1 always on top, 2 above the game only; ox, oy: the place of this window on the screen in pixels (the panes tell their places in screen pixels). -->
<meta charset="utf-8"><title>CMR Lab Center</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; -webkit-user-select: none; font: 13px 'Malgun Gothic', 'Segoe UI', sans-serif; color: #fff; user-select: none; }
  .pane { position: absolute; min-width: 160px; min-height: 90px; border: 1px solid rgba(255,255,255,.55); background: var(--bg); box-shadow: 0 0 0 1px #0006; }
  .pane .bar { height: 22px; line-height: 22px; padding: 0 8px; background: var(--bar); cursor: move; white-space: nowrap; overflow: hidden; }
  .pane .body { padding: 6px 8px; font-size: 12px; }
  .pane .grip { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #fff9 50%); }
  .pane button { margin-top: 4px; }
</style>
<body>
<script>
  const q = new URLSearchParams(location.search), mode = Number(q.get('mode')) || 0, ox = Number(q.get('ox')) || 0, oy = Number(q.get('oy')) || 0;
  const NAMES = ['ordinary', 'always on top', 'above the game only'], COLORS = [['rgba(40,70,140,.35)', '#2f4f9a'], ['rgba(30,120,60,.35)', '#25813f'], ['rgba(170,90,20,.35)', '#b5651d']];
  document.title = 'CMR Lab Center ' + NAMES[mode];
  const dpr = () => window.devicePixelRatio || 1;
  const MAC = /Mac/i.test(navigator.platform);                  // (macOS: the places are told in pixels like on Windows, but from where the window really is on the screen: screenX / screenY, in points, times the scale)
  const panes = [];
  // a pane: starts near the top left of the main screen (screen pixel 0,0 is at (-ox, -oy) of this window)
  function make(id, i) {
    const el = document.createElement('div'); el.className = 'pane';
    el.style.setProperty('--bg', COLORS[mode][0]); el.style.setProperty('--bar', COLORS[mode][1]);
    el.style.left = ((-ox) / dpr() + 120 + mode * 70 + i * 40) + 'px'; el.style.top = ((-oy) / dpr() + 120 + mode * 40 + i * 140) + 'px';
    el.style.width = '300px'; el.style.height = '160px';
    el.innerHTML = '<div class="bar"></div><div class="body"><div class="info"></div><button>click test</button> <span class="n">0</span></div><div class="grip"></div>';
    el.querySelector('.bar').textContent = `${NAMES[mode]} · pane ${id}`;
    let n = 0; el.querySelector('button').onclick = () => { el.querySelector('.n').textContent = ++n; };
    // dragging by the bar, resizing by the grip: pointer capture keeps the events while the pointer leaves the pane
    const drag = (target, fn) => target.addEventListener('pointerdown', e => {
      if (e.button !== 0) return; target.setPointerCapture(e.pointerId);
      const s = { x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
      const move = m => { fn(s, m.clientX - s.x, m.clientY - s.y); report(); };
      const up = () => { target.removeEventListener('pointermove', move); target.removeEventListener('pointerup', up); report(); };
      target.addEventListener('pointermove', move); target.addEventListener('pointerup', up);
    });
    drag(el.querySelector('.bar'), (s, dx, dy) => { el.style.left = s.l + dx + 'px'; el.style.top = s.t + dy + 'px'; });
    drag(el.querySelector('.grip'), (s, dx, dy) => { el.style.width = Math.max(160, s.w + dx) + 'px'; el.style.height = Math.max(90, s.h + dy) + 'px'; });
    document.body.append(el); panes.push({ id: String(id), el });
  }
  make('A', 0); make('B', 1);
  let busy = false, again = false, lastKey = '';
  async function report() {
    if (busy) { again = true; return; }
    busy = true;
    try {
      do {
        again = false;
        const d = dpr();
        const list = panes.map(p => { const r = p.el.getBoundingClientRect(); p.el.querySelector('.info').textContent = `${Math.round(r.width * d)}x${Math.round(r.height * d)} dpr ${d}${MAC ? ` at ${Math.round(screenX + r.left)},${Math.round(screenY + r.top)}` : ''}`;
          return MAC ? { id: p.id, x: (screenX + r.left) * d, y: (screenY + r.top) * d, w: r.width * d, h: r.height * d, pt: true, k: d } : { id: p.id, x: ox + r.left * d, y: oy + r.top * d, w: r.width * d, h: r.height * d }; });
        const key = JSON.stringify(list);
        if (key !== lastKey) { lastKey = key; await window.__TAURI__.core.invoke('lab_rects', { label: 'lab_c' + mode, panes: list }); }
      } while (again);
    } catch (e) { document.title = 'ERR ' + e; } finally { busy = false; }
  }
  report(); setInterval(report, 1000);
</script>
