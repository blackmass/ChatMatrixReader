<!doctype html>
<!-- LAB (a test, to be removed): a very small window for the test of "many small windows" (the file lab_windows next to the program names how many: see main.rs lab_spawn).
     Nothing here is used by the program. ?hz=N: N changes of its text a second (0 = nothing moves at all); ?show=1: visible (else almost transparent). -->
<meta charset="utf-8">
<title>CMR Lab</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font: 10px sans-serif; color: #fff; }
  body { background: rgba(255, 255, 255, 0.012); }
  body.show { background: rgba(200, 60, 60, 0.7); }
</style>
<body><span id="t">0</span>
<script>
  const q = new URLSearchParams(location.search), hz = Number(q.get('hz')) || 0;
  if (q.get('show') === '1') document.body.classList.add('show');
  if (hz > 0) { let n = 0; setInterval(() => { document.getElementById('t').textContent = ++n; }, Math.max(20, 1000 / hz)); }
</script>
