<!doctype html>
<html>
<head><meta charset="utf-8"><title>CMR Pick</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  #shot { position: fixed; display: none; pointer-events: none; }
  #veil { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.28); cursor: crosshair; }
  #hint { position: fixed; left: 50%; top: 24px; transform: translateX(-50%); padding: 7px 14px; border-radius: 6px; background: rgba(20, 20, 20, 0.85); color: #fff; font: 14px "Segoe UI", sans-serif; pointer-events: none; }
  #box { position: fixed; border: 2px solid #4da3ff; background: rgba(77, 163, 255, 0.12); box-shadow: 0 0 0 99999px rgba(0, 0, 0, 0.28); display: none; pointer-events: none; }
  #size { position: fixed; padding: 2px 6px; border-radius: 4px; background: rgba(20, 20, 20, 0.85); color: #fff; font: 12px "Segoe UI", sans-serif; display: none; pointer-events: none; }
</style></head>
<body>
  <img id="shot" alt=""><div id="veil"></div><div id="box"></div><div id="size"></div><div id="hint"></div>
  <script src="common.js"></script>
  <script type="module" src="pick.js"></script>
</body>
</html>
