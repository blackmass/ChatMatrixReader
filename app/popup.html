<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="chatview.css"><link rel="stylesheet" href="widgets.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: max-content; height: max-content; }
  /* here the box is the window: it is not placed, it just sits at the top left (the window is moved and sized to it) */
  #ctx { position: static; max-height: none; overflow: visible; min-width: 150px; }
  #ctx[hidden], #tip[hidden], #wtip[hidden] { display: none; }
  #tip { position: static; display: block; box-sizing: border-box; max-width: 250px; pointer-events: none; }
  #tip td { overflow-wrap: anywhere; }
  #tip td[align=right] { white-space: nowrap; overflow-wrap: normal; padding-left: 12px; }       /* (a price / a slot is never broken: only the left text wraps) */
  #wtip { position: static; max-width: 260px; }
</style></head>
<body class="popup">
  <div id="ctx" hidden data-notr></div>
  <div id="tip" class="cv-tip" hidden data-notr></div>
  <div id="wtip" class="w-tip" hidden data-notr></div>
  <script src="common.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
