<!doctype html>
<html><head><meta charset="utf-8"><title>lab sample</title>
<script>
  // what happens while the page loads (the reader of the test prints it when the page does not finish)
  const diag = []; const send = () => parent.postMessage({ diag: diag.slice() }, '*');
  addEventListener('securitypolicyviolation', e => { diag.push('CSP violation: ' + e.violatedDirective + ' blocked=' + e.blockedURI); send(); });
  addEventListener('error', e => { diag.push('error: ' + (e.message || (e.target && (e.target.src || e.target.href)) || '?')); send(); }, true);
  diag.push('inline script ran (origin ' + location.origin + ')'); send();
  window.__diag = diag;
</script>
<link rel="stylesheet" href="style.css">
</head><body>
<p>lab sample</p>
<img id="pix" src="pixel.png" alt="">
<script type="module" src="main.mjs"></script>
</body></html>
