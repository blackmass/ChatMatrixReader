[package]
name = "chatmatrix-reader"
version = "3.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "custom-protocol" = production mode. With it, plain `cargo build --release` works and the Tauri CLI / Node.js are not needed.
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "image-ico", "image-png", "macos-private-api"] }   # no "devtools": no F12 / Inspect in the program (changes go through the source)
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
serde_json = "1"

# sound diagnostics / capture (Windows only; Tauri already pulls in this crate, the version is pinned so there is a single copy)
[target.'cfg(windows)'.dependencies]
# the #[implement] macro of `windows` names this crate directly, so it must be a direct dependency (same 0.61 line as `windows`)
windows-core = "0.61"
# the web view of Windows: a window of the mini browser says to the web view what it is (a phone: the headers of the browser too) by the protocol of the developer tools. Same version as Tauri's own.
windows-core062 = { package = "windows-core", version = "0.62" }
webview2-com = "0.39"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Devices_FunctionDiscovery",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Variant",
  # the capture of the game window (wgc.rs): Windows Graphics Capture and the graphics card
  "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Foundation",
  "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm",
  "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
]

# macOS: the same jobs as win.rs, written in mac.rs (window level, click-through, screen copy ...). These crates are already part of the Tauri dependency tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"
foreign-types = "0.5"
# the sound capture of the voice recognition (ScreenCaptureKit, macOS 13+): the same crate family as `objc2` above
block2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
dispatch2 = "0.3"
objc2-core-foundation = "0.3"

[profile.release]
opt-level = "s"      # optimise for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
